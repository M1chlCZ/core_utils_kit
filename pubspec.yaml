name: core_utils_kit
description: >-
  Small Flutter utilities: secure key-value storage, date and time
  formatting, color generation, URL opening, and app lifecycle watching
  without extra state-management dependencies.
version: 0.3.0
repository: https://github.com/M1chlCZ/core_utils_kit
issue_tracker: https://github.com/M1chlCZ/core_utils_kit/issues
topics:
  - utilities
  - storage
  - extensions
  - lifecycle
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
